# ERFPS (Ver.2) configuration.
# This config may be edited at runtime, with changes affecting the live game.
# Do not remove any fields!

[fov]
# Horizontal field of view (in degrees) in first person.
# Possible value range: 45.0 - 130.0
horizontal_fov = 90.0

# Correction of distortion caused by high FOV.
# These options reduce FOV distortion and may improve depth perception in first person.
# Possible values: "none", "fisheye", "barrel"
fov_correction = "barrel"

# The strength of FOV correction.
# Larger values may introduce visible radial curvature and a reduction in image quality.
# Possible value range: 0.0 - 1.0
fov_correction_strength = 0.55

# The aspect ratio correction strength for "barrel" fov_correction.
# Larger values reduce horizontal stretch and increase vertical stretch.
# Possible value range: 0.0 - 1.0
fov_correction_cylindricity = 1.0

[gameplay]
# When starting up the game and loading a character the camera will start out in first person.
start_in_first_person = true

# When first entering first person during a session a mod tutorial will be shown once.
show_tutorial = true

# Locking on to enemies in first person does not restrict camera movement.
# The default "hard" lock on aims the camera at the targeted enemy.
soft_lock_on = false

# When an enemy is on screen lock on will be prioritized to switching perspectives.
prioritize_lock_on = true

# Some animations (like attacks) allow for freer directional movement in first person.
unlocked_movement = true

# The player's body is made transparent during dodges, improving visibility.
unobtrusive_dodges = false

# Camera movement will be synchronized with head movement for dodges.
track_dodges = false

# Camera movement will be synchronized with head movement when the player is damaged.
track_damage = false

# Initial sprinting direction is restricted to moving forward.
restricted_sprint = false

[player]
# Scales the player's height (first person only).
# The player is assumed to be about 170cm (5'7") tall by default.
# Possible value range: 0.95 - 1.05
height_multiplier = 1.0

[stabilizer]
# Stabilization of camera movement in first person.
enabled = true

# The time period (in fractions of a second) to sample camera positions.
# Larger values result in smoother camera movement but make it slower to adjust.
# Possible value range: 0.1 - 1.0
smoothing_window = 0.3

# The strength of camera smoothing.
# Larger values result in smoother camera movement but also separate it from the player's.
# Possible value range: 0.0 - 1.0
smoothing_factor = 0.8

[camera]
# The dummy polygon (attachment point) on the player model the first person camera follows.
# 907 is the head. Other IDs can be found by inspecting the player model (c0000) in a tool like DSAnimStudio.
# An ID that does not exist on the model will break the camera.
attach_dummy_id = 907

# How strongly the camera follows the small translational movements of the attachment point
# (walking and running bob, breathing, animation sway) relative to their moving average.
# 1.0 follows the point exactly as smoothed by the stabilizer, 0.0 removes the movement entirely,
# values above 1.0 exaggerate it. Camera rotation is not affected.
# For raw, unsmoothed following disable the stabilizer.
# Possible value range: 0.0 - 3.0
wobble = 1.0

# SpEffect IDs that lock the first person camera's rotation to the attachment point's rotation.
# While any of these SpEffects is active on the player, the camera turns together with the
# character (for example during spinning ashes of war), without the usual easing delay.
# When the SpEffect ends the camera eases back to the direction you were looking in.
# Use log_sp_effects below to find the IDs. Example: rotation_lock_sp_effects = [12345, 67890]
rotation_lock_sp_effects = []

# Writes the SpEffects added to and removed from the player to erfps2.log.
# Turn this on, perform the action, then read the log to find its SpEffect IDs.
log_sp_effects = false

# Tracking range for rotation_lock_sp_effects. With this enabled the camera only follows the
# character while the character has turned no further than the range below from where it was
# facing when the effect began (your aim, or your target when locked on). Once the character
# turns further away, for example during a spin, the camera returns to the fixed direction you
# are aiming in and stays there until the character is back within the range, then follows again.
# Without a range the camera follows the character completely, which can leave you looking at
# the ground or away from your target for the whole animation.
rotation_lock_aim_range = false

# Horizontal (X) range in degrees, to the left and to the right of the aim.
# 0 never follows horizontally. 180 means the camera always follows.
# Possible value range: 0.0 - 180.0
rotation_lock_aim_range_x = 90.0

# Vertical (Y) range in degrees, above and below the aim.
# 0 never follows vertically. 90 means the camera always follows.
# Possible value range: 0.0 - 90.0
rotation_lock_aim_range_y = 30.0

# The same range, used instead of the aim range while you are locked on to an enemy
# (with the default hard lock on the camera is aimed at the target, so this is the range around
# the target). With soft_lock_on enabled the aim range is always used, since the camera is not
# aimed at the target.
rotation_lock_target_range = false

# Possible value range: 0.0 - 180.0
rotation_lock_target_range_x = 60.0

# Possible value range: 0.0 - 90.0
rotation_lock_target_range_y = 25.0

# The time in seconds the camera takes to leave the range (return to the fixed direction) and
# to rejoin it. 0 snaps instantly. Small values (0.03 - 0.1) soften the snap, but during fast
# spins the character crosses the range so quickly that larger values hide most of the tracking.
# Possible value range: 0.0 - 1.0
rotation_lock_range_blend = 0.0

[crosshair]
# Crosshair in first person.
# Possible values: "none", "cross", "dot", "circle", "circledot", "angled"
kind = "dot"

# The horizontal scale of the crosshair reticle.
# Possible value range: 0.1 - 4.0
scale_x = 1.2

# The vertical scale of the crosshair reticle.
# Possible value range: 0.1 - 4.0
scale_y = 1.2
